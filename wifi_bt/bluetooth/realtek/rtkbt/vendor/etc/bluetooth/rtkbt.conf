# RELEASE NAME: 20180517_BT_ANDROID_9.0
# Bluetooth Device Name; NULL or comment means "ro.product.model"
#Name=Realtek Bluetooth

# Device Class
DevClassServiceClass=0x1A
DevClassMajorClass=0x01
DevClassMinorClass=0x1C

#Indicate USB or UART driver bluetooth
BtDeviceNode=?/dev/ttyS1:H5

# BtSnoop log output file
BtSnoopFileName=/data/vendor/bluetooth/btsnoop_hci.cfa

#bit0 = 1,don't show heartbeat packet in btsnoop
RtkbtLogFilter=1

# configuration for uart card to save HCI log for slave
H5LogOutput=0

# Enable Coex log
BtCoexLogOutput=0

# Enable net btsnoop Dump
RtkBtsnoopNetDump=fatrue


RtkAPCFWakeUpEn=true
RtkAPCFWakeUpSets=4
#Power

RtkAPCFWakeUpServiceData1=000000000000010101FD36
RtkAPCFWakeUpServiceDMask1=00000000000000FFFFFFFF
RtkAPCFWakeUpVDData1=051602
RtkAPCFWakeUpWaveDur1=200
RtkAPCFWakeUpWaveFre1=2AA
RtkAPCFWakeUpWaveTime1=1

#Netfix
RtkAPCFWakeUpServiceData2=000000000000010201FD36
RtkAPCFWakeUpServiceDMask2=00000000000000FFFFFFFF
RtkAPCFWakeUpVDData2=051602
RtkAPCFWakeUpWaveDur2=200
RtkAPCFWakeUpWaveFre2=CCCC
RtkAPCFWakeUpWaveTime2=1

#Power
RtkAPCFWakeUpCompanyId3=FFFF
RtkAPCFWakeUpCIdMask3=FFFF
RtkAPCFWakeUpManuData3=00000000000000016369676F6C6D41
RtkAPCFWakeUpManuDMask3=00000000000000FFFFFFFFFFFFFFFF
RtkAPCFWakeUpVDData3=0AFF02
RtkAPCFWakeUpWaveDur3=200
RtkAPCFWakeUpWaveFre3=2AA
RtkAPCFWakeUpWaveTime3=1

#Netfix
RtkAPCFWakeUpCompanyId4=FFFF
RtkAPCFWakeUpCIdMask4=FFFF
RtkAPCFWakeUpManuData4=00000000000000026369676F6C6D41
RtkAPCFWakeUpManuDMask4=00000000000000FFFFFFFFFFFFFFFF
RtkAPCFWakeUpVDData4=0AFF02
RtkAPCFWakeUpWaveDur4=200
RtkAPCFWakeUpWaveFre4=CCCC
RtkAPCFWakeUpWaveTime4=1

# Enable auto restart bt
RtkBtAutoRestart=true
# Enable caputure fw log Via HCI
RtkBtCaptureFwLog=false
RtkBtFwLog_ACL=false

